<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Employee</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
        }

        .form-container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #198754;
            color: white;
            border: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="form-container">

    <h2>Add Employee</h2>

    <form th:action="@{/employees/save}"
          th:object="${employee}"
          method="post">

        <label>Employee ID</label>
        <input type="number"
               th:field="*{id}"
               required>

        <label>Name</label>
        <input type="text"
               th:field="*{name}"
               required>

        <label>Department</label>
        <input type="text"
               th:field="*{department}"
               required>

        <label>Designation</label>
        <input type="text"
               th:field="*{designation}"
               required>

        <label>Salary</label>
        <input type="number"
               step="0.01"
               th:field="*{salary}"
               required>

        <button type="submit">
            Save Employee
        </button>

    </form>

    <a href="/employees" class="back">
        Back to Employee List
    </a>

</div>

</body>
</html>
